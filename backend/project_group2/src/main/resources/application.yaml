# Supports repository-root and backend working directories; OS environment wins.
spring:
  application:
    name: sba_project
  config:
    import:
      - optional:file:./backend/project_group2/.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:prefer}&connectTimeout=10&socketTimeout=60&tcpKeepAlive=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: BabyClothesShopPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 10000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_schema: shop
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    default-schema: shop
    schemas: shop
    create-schemas: false
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

app:
  auth-cookie:
    # false cho HTTP localhost; dùng true khi triển khai HTTPS.
    secure: ${AUTH_COOKIE_SECURE:false}
  jwt:
    # Đọc khóa từ môi trường hoặc .env; không đặt khóa thật trong file được commit.
    secret-base64: ${JWT_SECRET_BASE64}
    # TTL là thời gian tồn tại tính bằng giây: 15 phút và 7 ngày.
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    # Phải trùng giữa lúc cấp và xác minh JWT.
    issuer: ${JWT_ISSUER:baby-clothes-shop-api}
    audience: ${JWT_AUDIENCE:baby-clothes-shop}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    connection-timeout: 20s
    max-http-form-post-size: 2MB

logging:
  level:
    root: INFO
    com.fptu.project_group2: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
